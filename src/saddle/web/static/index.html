<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>saddle</title>
<link rel="stylesheet" href="/static/app.css">
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <span class="brand">saddle</span>
      <button id="settings" title="Settings and personas">⚙</button>
      <button id="new-session" title="New session">+</button>
    </div>
    <div id="session-list"></div>
    <div class="side-foot">
      <label>Persona
        <select id="persona"></select>
      </label>
      <label>Temperature <output id="temp-value">1.0</output>
        <input id="temp" type="range" min="0" max="2" step="0.1" value="1">
      </label>
      <label>Thinking
        <select id="effort">
          <option value="none">none</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="xhigh">xhigh</option>
        </select>
      </label>
      <label>Folder
        <button id="pick-folder" class="folder"><span id="folder-name">—</span></button>
      </label>
    </div>
  </aside>

  <main>
    <header id="topbar">
      <input id="title" spellcheck="false" aria-label="Session title">
      <span id="meter" title="context used"><i></i><b></b></span>
      <span id="status" class="status idle">idle</span>
    </header>

    <div id="transcript"></div>

    <form id="composer" autocomplete="off">
      <div id="attachments"></div>
      <div class="composer-row">
        <button type="button" id="attach" title="Attach files or images">＋</button>
        <textarea id="input" rows="1" placeholder="what are we making today?"
                  spellcheck="false"></textarea>
        <button type="submit" id="send" title="Send">↑</button>
      </div>
      <input type="file" id="file-input" multiple hidden>
    </form>
  </main>
</div>

<dialog id="folder-dialog">
  <h3>Working folder</h3>
  <div id="folder-path" class="mono"></div>
  <div id="folder-entries"></div>
  <menu>
    <button id="folder-up">Up</button>
    <button id="folder-cancel">Cancel</button>
    <button id="folder-use" class="primary">Use this folder</button>
  </menu>
</dialog>

<dialog id="settings-dialog">
  <h3>Settings</h3>
  <p class="hint">What a new session starts as. Changing a session's own
     persona or thinking level only affects that session.</p>
  <div class="settings-grid">
    <label>Default persona <select id="default-persona"></select></label>
    <label>Default temperature <output id="default-temp-value">1.0</output>
      <input id="default-temp" type="range" min="0" max="2" step="0.1" value="1">
    </label>
    <label>Default thinking
      <select id="default-effort">
        <option value="none">none</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
        <option value="xhigh">xhigh</option>
      </select>
    </label>
  </div>

  <h3>Personas</h3>
  <p class="hint">A persona is the system prompt a session starts with. Edit
     a built-in one and your version is used until you reset it.</p>
  <div class="persona-edit">
    <select id="persona-pick" size="6"></select>
    <div class="persona-body">
      <input id="persona-name" placeholder="name" spellcheck="false" maxlength="40">
      <textarea id="persona-prompt" rows="8" spellcheck="false"
                placeholder="What this persona tells the model to be."></textarea>
      <div class="persona-actions">
        <button id="persona-new" type="button">New</button>
        <button id="persona-delete" type="button">Delete</button>
        <button id="persona-save" type="button" class="primary">Save persona</button>
      </div>
      <p id="persona-note" class="hint"></p>
    </div>
  </div>
  <div class="dialog-actions"><button id="settings-close" type="button">Close</button></div>
</dialog>
<script src="/static/markdown.js"></script>
<script src="/static/app.js"></script>
