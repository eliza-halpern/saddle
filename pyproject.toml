[project]
name = "saddle-harness"
version = "0.1.1"
description = "Deterministic execution harness for non-deterministic local LLMs."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Eliza Halpern" }, { name = "Eryn Lipkowitz" }]
requires-python = ">=3.12"
dependencies = [
    "coverage>=7.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "rich>=13.9",
    # The chat UI (`saddle web`). Starlette rather than a hand-rolled
    # http.server: SSE, multipart uploads and routing are all things worth
    # borrowing rather than reinventing, and uvicorn is its usual server.
    "starlette>=0.41",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    # The gates run these, and `audit.gate_surface` reads their versions, so
    # an install without them cannot audit anything. The mutmut bound is
    # the release the batched mutant lookup was measured against: it imports
    # mutmut's internal modules (`evidence._MUTANT_LOOKUP_SCRIPT`).
    "mutmut>=3.8",
    "pytest>=8.3",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "hypothesis>=6.130",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "mypy>=1.14",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8",
    "pyyaml>=6.0.3",
    "shellcheck-py>=0.11.0.1",
    "taplo>=0.9.3",
]

[project.scripts]
saddle = "saddle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saddle"]

[tool.ruff]
target-version = "py312"
line-length = 100
# mutmut's work copies are generated artifacts, never lint targets.
# benchmark/tasks holds task fixtures: planted bugs, misleading comments
# and adapted third-party reference code. Linting them would defeat
# their purpose, and they are never imported by saddle.
exclude = ["mutants", "benchmark/tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "EM", "PT", "RUF"]

[tool.mypy]
strict = true
warn_unused_ignores = true
# `tools/` and `benchmark/` are directories of scripts, not packages, and the
# tests import them as `tools.x` and `benchmark.x` while the same files given
# on the command line are the top-level modules `x`: mypy refuses that as
# "found twice". Naming each module root fixes one name per file. `tests`
# is a root because the tests import their siblings bare.
explicit_package_bases = true
mypy_path = ["src", "tests", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Extends (not replaces) the defaults: task fixtures are graded against
# arm workdirs, never collected here.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist",
                 "node_modules", "venv", "{arch}", "benchmark/tasks", "mutants"]
markers = [
    "packaging: builds the sdist or wheel and inspects or installs it (tests/test_packaging.py)",
]
addopts = "--cov=saddle --cov=tools --cov=benchmark --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
# `tools` and `benchmark` are directories of scripts, not packages; the gate
# holds them to the same 100% as `saddle`. benchmark/tasks (planted defects,
# graded against arm workdirs) is not listed: coverage does not descend into
# directories that are not packages, and nothing imports a task.
source = ["saddle", "tools", "benchmark"]
branch = true

[tool.saddle]
# How long one run of this repo's test suite may take under saddle's own test
# gate, in seconds (docs/CLI.md, "The test time limit"). The built-in 300 s
# refused this suite as a hang: `check.sh` runs it in 1209-1378 s, and the
# gate's own sandboxed coverage run of it took about 2300 s in a 2-core slot.
# Read from the commit a run or audit starts from, never from the tree it judges.
test-timeout = 3600
# How many pytest-xdist workers the audit runs this suite on (docs/CLI.md, "Running
# the tests on workers"), and `check.sh` too: 376 s on 8 workers with coverage,
# against 1209-1378 s serially. Read like test-timeout, from the starting commit.
test-workers = 8
# The finish audit runs this beside the suite and refuses on a failure: the
# same strict mypy check.sh runs, so a run's new test file or script is
# type-checked too.
static-check = ["mypy", "src", "tests", "tools", "benchmark/stall_check.py"]
# The other fast stages of check.sh (everything but npm ci, mypy, which is the
# static-check above, and the suite), each run on the audited tree and on the
# starting commit so a stage the change broke is told from one already red
# (docs/CLI.md, "The project's gate stages"). tests/test_gate_checks.py keeps it
# equal to check.sh. Read from the starting commit, so it applies to runs that
# start after it lands.
gate-checks = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
    ["actionlint", ".github/workflows/ci.yml"],
    ["uv", "lock", "--check"],
    [
        "shellcheck",
        "check.sh",
        "ci-mutate.sh",
        "tools/githooks/commit-msg",
        "tools/githooks/pre-commit",
        "tools/githooks/pre-push",
    ],
    ["npx", "--no-install", "eslint", "."],
    ["npx", "--no-install", "tsc", "-p", "tsconfig.json"],
    [
        "npx",
        "--no-install",
        "c8",
        "node",
        "--test",
        "tests/markdown.test.js",
        "tests/classic_scripts.test.js",
    ],
    ["npx", "--no-install", "html-validate", "src/saddle/web/static/index.html"],
    ["npx", "--no-install", "stylelint", "src/saddle/web/static/app.css"],
    ["npx", "--no-install", "markdownlint-cli2"],
]
# The browser tests drive Chrome with node; the audit's sandbox hides HOME, where
# node may live, so name both here (docs/CLI.md, "Commands the sandbox shows").
# Read like test-timeout, from the starting commit.
sandbox-expose = ["node", "google-chrome"]

[tool.mutmut]
# Tier-2 sampled self-mutation (ARCHITECTURE.md §3): scoped to src, time-boxed in CI.
# mutmut 3.x runs pytest in-process; coverage is disabled for mutant runs
# (per-run coverage is pure overhead and fails the 100% gate by design).
# `tools/` is deliberately not a source path. Measured by mutating all three
# scripts in a scratch copy with the tests that import them: 639 mutants, 10
# survivors, 86 timeouts, 7 min 57 s of wall time. That is more than the whole
# phase-1 budget in ci-mutate.sh (480 s) for scripts no run executes, and 6
# of the 10 survivors are equivalent mutants (`check=False` spelled `None` or
# dropped, `"latin-1"` spelled `"LATIN-1"`, header name case) that no test can
# kill, while ci-mutate.sh fails the job on any survivor in a selected module.
# Adopting it needs `# pragma: no mutate` on those lines, a time budget of its
# own, and a `tools/*.py` arm in ci-mutate.sh's module mapping. The scripts'
# tests are held to a contract mutant per behaviour group by review instead
# (CONTRIBUTING.md), and to 100% line and branch coverage by the gate.
source_paths = ["src/saddle/"]
# Copied into mutants/ unmutated. benchmark/: test_stall_check imports the
# harness. docs/: test_docs reads ARCHITECTURE.md. tools/: the diff-grammar
# test imports diff_grammar_check. A test that reads outside the copy fails
# there whatever the mutation and kills every mutant, so the Tier-2 score
# would read 100% while measuring nothing; test_mutmut_layout runs those
# modules in a rebuilt copy and lists them in OUTSIDE_READERS.
also_copy = ["benchmark/", "docs/", "tools/"]
# `--ignore` is required, not cosmetic: pyproject is not copied into
# mutants/, so `norecursedirs` does not apply there and pytest would
# collect benchmark/tasks' hidden grading tests for every mutant.
pytest_add_cli_args = [
    "-p",
    "no:cov",
    "-o",
    "addopts=",
    "-q",
    "-x",
    "--ignore=benchmark/tasks",
]
