name: ci
# Private repo: Actions minutes are metered (2,000/month free). Branch pushes
# are verified locally before they land, so CI runs only on main and on PRs
# into main; the mutation job is manual (workflow_dispatch) because it bills
# up to 15 minutes per run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # check.sh installs the pinned npm packages and runs the browser tests;
      # the Node major comes from .node-version. The browser tests use the
      # google-chrome that the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: ./check.sh
  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # Tier-2 self-mutation: phase 1 guarantees the diff's modules,
      # phase 2 samples the rest on rotation. Judged by survivors,
      # never by the clock, so timeouts degrade instead of failing.
      - run: ./ci-mutate.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
