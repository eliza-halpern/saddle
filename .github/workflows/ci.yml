name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: ./check.sh
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # Tier-2 self-mutation (Revamp §3): full run while the codebase is
      # small; time-boxed so growth degrades to a sampled budget, not hangs.
      - run: timeout 600 uv run --frozen mutmut run
      - run: uv run --frozen mutmut results
